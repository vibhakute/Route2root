<style>

@media(prefers-color-scheme:dark){:root{--bg:#0b1220;--card:#131c2e;--tx:#e6edf7;--mut:#94a3b8;--bd:#24304a;--sel:#1b2a47}}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--tx);font:13px system-ui,-apple-system,Segoe UI,Roboto,sans-serif}
.app{display:grid;grid-template-columns:210px minmax(0,1fr);min-height:100vh}

.card{background:var(--card);border:1px solid var(--bd);border-radius:14px;padding:14px;min-width:0}
.sc{display:flex;gap:10px;align-items:center}.sc b{font-size:22px;display:block}.ic{font-size:24px;width:44px;height:44px;border-radius:50%;display:grid;place-items:center;background:#ffffff88}
.c1{background:#e3f7ea}.c2{background:#fdeedc}.c3{background:#e0edfd}.c4{background:#ece6fb}@media(prefers-color-scheme:dark){.c1,.c2,.c3,.c4{background:#1a2740}}
h3{margin:0 0 8px;font-size:14px}small,.mut{color:var(--mut)}.row{display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap}
table{width:100%;border-collapse:collapse;font-size:12px}th{color:var(--mut);text-align:left;padding:6px 4px;border-bottom:1px solid var(--bd)}td{padding:7px 4px;border-bottom:1px solid var(--bd);vertical-align:top}.w{overflow-x:auto}

.Pending,.Reserved,.Handover{background:#fdecd2;color:#b45309}.Available,.Accepted,.PickedUp{background:#dcf5e5;color:#15803d}.Delivered,.Dispatched{background:#d4e8fb;color:#1d4ed8}.SafetyHold,.Cancelled,.Discarded{background:#fde0e0;color:#b91c1c}
button.b{font:inherit;border:1px solid var(--bd);background:var(--card);color:var(--tx);padding:7px 11px;border-radius:9px;cursor:pointer}button.b:hover{border-color:var(--pri)}

input,select{font:inherit;padding:7px;border:1px solid var(--bd);border-radius:8px;background:var(--card);color:var(--tx);width:100%}
label{display:grid;gap:3px;font-size:11px;color:var(--mut)}.form{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:8px;align-items:end}

#login{max-width:420px;margin:6vh auto;padding:0 14px}#toast{position:fixed;bottom:16px;left:50%;transform:translateX(-50%);background:#14233c;color:#fff;padding:10px 16px;border-radius:10px;display:none;z-index:9999}

:root{--bg:#f4f7fb;--card:#fff;--tx:#17243b;--mut:#718096;--bd:#e4eaf2;--pri:#235fc7;--sel:#eaf1ff;--green:#16845b;--shadow:0 4px 18px rgba(26,45,78,.045)}

input,select{padding:10px 12px;border-radius:10px;border-color:#dfe6f0;min-height:41px;font-size:13px}

button.b:active{transform:translateY(1px)}

table{font-size:12px;min-width:650px}

tr:last-child td{border-bottom:0}

.bar{margin-top:5px}

.urg{padding:12px 4px;align-items:center}
#map{height:380px;border-radius:13px}

#login{max-width:440px;margin:9vh auto;padding:0 16px}

@media(max-width:1100px){.app{grid-template-columns:220px minmax(0,1fr)}.content{padding:22px 18px}.top{padding:14px 18px}.g4{grid-template-columns:repeat(2,minmax(0,1fr))}.g2{grid-template-columns:1fr}}
@media(max-width:760px){.app{grid-template-columns:minmax(0,1fr)}aside{position:sticky;top:0;height:auto;flex-direction:row;overflow-x:auto;padding:9px;gap:5px;border-right:0;border-bottom:1px solid var(--bd);background:#fff}.logo,.quote{display:none}.nav{white-space:nowrap;width:auto;flex:0 0 auto;padding:9px 12px}.nav.on{box-shadow:inset 0 -3px #235fc7}.top{padding:12px 15px}.content{padding:17px 12px 28px;gap:14px}.page-heading h1{font-size:23px}.g4{grid-template-columns:repeat(2,minmax(0,1fr));gap:9px}.sc{padding:12px;gap:9px;min-height:100px}.sc .ic{width:34px;height:34px;flex-basis:34px;font-size:17px}.sc b{font-size:23px}.card{padding:16px;border-radius:13px}.form{grid-template-columns:repeat(2,minmax(0,1fr))}.form-actions{grid-column:1/-1}.section-head{gap:10px}}
@media(max-width:420px){.g4{grid-template-columns:1fr 1fr}.sc{align-items:flex-start;flex-direction:column}.sc .ic{display:none}.form{grid-template-columns:1fr}.top{align-items:flex-start}.top .row{gap:6px}}

</style></head><body>
<div id="login" style="display:none"></div>
<div class="app" id="app" style="display:none"><aside id="side"></aside><div><div class="top" id="top"></div><div class="content" id="content"></div></div></div>
<div id="toast"></div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
<script>
const $=id=>document.getElementById(id);let mapEl=null,tok=localStorage.r2r,S=null,view='dash',mode='login',es=null,map=null,layer=null;
const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const toast=m=>{const t=$('toast');t.textContent=m;t.style.display='block';clearTimeout(toast.h);toast.h=setTimeout(()=>t.style.display='none',3800)};
async function api(p,m='GET',b){const r=await fetch('/api'+p,{method:m,headers:{'Content-Type':'application/json',Authorization:'Bearer '+tok},body:b?JSON.stringify(b):undefined});const j=await r.json().catch(()=>({}));
 if(!r.ok){if(r.status===401&&S)logout();throw new Error(j.error||r.statusText)}return j}
const act=async(p,m,b)=>{try{await api(p,m,b);await load()}catch(e){toast(e.message)}};
function logout(){localStorage.removeItem('r2r');tok=null;S=null;if(es)es.close();boot()}
// ---------- login / register ----------
function loginView(){$('app').style.display='none';const L=$('login');L.style.display='block';const reg=mode==='register';
 L.innerHTML=`<div class="card"><div class="logo">🌱 Route2Root<small>Unified Civic Aid Operations Console</small></div><div class="eyebrow" style="font-size:11px;color:var(--pri);font-weight:700;margin:8px 0">ADMIN ACCESS ONLY</div>
 <form id="lf" class="form" style="grid-template-columns:1fr"><label>Admin email<input id="r-email" type="email" value="admin@demo.in" required></label><label>Password<input id="r-pw" type="password" value="demo1234" required></label><button class="b fill">Open master dashboard</button></form>
 <p class="mut">Single admin login. Donor, rider, shelter, orders, dispatch and safety tools are available from the left navigation after login.</p></div>`;
 $('lf').onsubmit=async e=>{e.preventDefault();const v=id=>$(id)?.value;try{const r=await fetch('/api/login',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({email:v('r-email'),password:v('r-pw')})});const j=await r.json();if(!r.ok)throw new Error(j.error);tok=j.token;localStorage.r2r=tok;boot()}catch(x){toast(x.message)}}}
function regRole(){const r=$('r-role').value;$('extra').innerHTML=r==='rider'?`<label>Vehicle<input id="x-veh" value="Two-wheeler"></label><label>Carrying capacity<input id="x-cap" type="number" value="40"></label>`:r==='shelter'?`<label>Latitude<input id="x-lat" value="18.52"></label><label>Longitude<input id="x-lng" value="73.85"></label><label>Demand<input id="x-dem" type="number" value="50"></label><label><span><input type="checkbox" id="x-cook" style="width:auto"> Cooking facility</span></label><label><span><input type="checkbox" id="x-water" checked style="width:auto"> Clean water</span></label>`:''}
// ---------- data ----------
const clock=()=>S.now+(Date.now()-S.fetched),left=b=>Math.round((b.deadline-clock())/60000),A=()=>S.me.role==='admin';
async function load(){S=await api('/state');S.fetched=Date.now();render()}
async function boot(){if(!tok)return loginView();$('login').style.display='none';try{await load()}catch{return loginView()}if(S.me.role!=='admin'){logout();return} $('app').style.display='grid';
 if(es)es.close();es=new EventSource('/api/stream?t='+tok);es.onmessage=()=>load().catch(()=>{});setInterval(()=>S&&render(),30000);
 if(S.me.role==='rider')startGeo()}
function startGeo(){const send=(lat,lng)=>api('/rider','POST',lat?{lat,lng}:{}).catch(()=>{});if(navigator.geolocation)navigator.geolocation.watchPosition(p=>send(p.coords.latitude,p.coords.longitude),()=>{},{maximumAge:30000});setInterval(()=>send(),60000)}
// ---------- UI helpers ----------
const P=s=>`<span class="p ${s}">${s.replace('PickedUp','In Transit').replace('SafetyHold','Safety Hold')}</span>`;
const T=(h,r)=>`<div class="w"><table><tr>${h.map(x=>`<th>${x}</th>`).join('')}</tr>${r.map(x=>`<tr>${x.map(c=>`<td>${c}</td>`).join('')}</tr>`).join('')||`<tr><td colspan="9" class="mut">Nothing here yet.</td></tr>`}</table></div>`;
const B=(onclick,l,c='')=>`<button class="b ${c}" onclick="${onclick}">${l}</button>`;
const ACT=['Reserved','Accepted','PickedUp','Handover'],act_=()=>S.batches.filter(b=>ACT.includes(b.status));
const tl=b=>['Delivered','SafetyHold','Cancelled','Discarded'].includes(b.status)?'–':`${left(b)}m<div class="bar"><i style="width:${Math.max(0,Math.min(100,left(b)/Math.max(1,(b.deadline-b.created)/60000)*100))}%;background:${left(b)<20?'#dc2626':'#16a34a'}"></i></div>`;
const feed=n=>`<div class="feed">${S.events.slice(0,n||40).map(e=>`<div><small>${new Date(e.ts).toLocaleTimeString()}</small> ${esc(e.msg)}</div>`).join('')||'<small>No activity yet.</small>'}</div>`;
const mapCard=big=>`<div class="card ${big?'big':''}"><div class="row"><h3>📍 Live Map <small>OpenStreetMap · rider positions are shared by riders or marked simulated</small></h3></div><div id="slot"></div></div>`;
const donRows=(l,own)=>l.map(d=>[`#${d.id}`,esc(d.donor),d.type,`${d.qty} (left ${d.rem})`,new Date(d.deadline).toLocaleTimeString(),P(d.status),(own||A())&&['Available','Pending'].includes(d.status)?B(`act('/donations/${d.id}/dispatch','POST')`,'Dispatch')+B(`act('/donations/${d.id}','DELETE')`,'Cancel'):'']);
const urgent=()=>{const o=[];S.batches.filter(b=>ACT.includes(b.status)&&left(b)<20).forEach(b=>o.push(['🔺',`Batch #${b.id}`,`Expires in ${left(b)} min (${b.type}, ${b.qty})`,'Critical']));
 S.batches.filter(b=>b.status==='SafetyHold').forEach(b=>o.push(['🛑',`Batch #${b.id}`,'Safety hold: needs review','Critical',A()?B(`act('/admin/batches/${b.id}/resolve','POST',{note:prompt('Handling note')||''})`,'Resolve'):'']));
 S.riders.filter(r=>!r.responsive).forEach(r=>o.push(['🟠',r.name,'Unresponsive','Reassign']));S.shelters.filter(s=>!s.open||s.demand===0).forEach(s=>o.push(['🏠',s.name,s.open?'Demand 0':'Closed','Reroute']));
 return `<div class="card"><h3 style="color:#dc2626">⚠ Urgent Actions</h3>${o.map(a=>`<div class="urg"><span>${a[0]}</span><div><b>${esc(a[1])}</b><br><small>${esc(a[2])}</small></div><span class="p">${a[3]}</span>${a[4]||''}</div>`).join('')||'<small>None.</small>'}</div>`};
const stats=()=>{const d=S.donations,idle=S.riders.filter(r=>r.online&&r.responsive).length;return `<div class="g4"><div class="card sc c1"><div class="ic">📦</div><div><small>Total Donations</small><b>${d.length}</b></div></div><div class="card sc c2"><div class="ic">🍽</div><div><small>Units awaiting dispatch</small><b>${d.reduce((a,x)=>a+x.rem,0)}</b></div></div><div class="card sc c3"><div class="ic">🛵</div><div><small>Riders online</small><b>${idle}</b><small>${act_().length} deliveries active</small></div></div><div class="card sc c4"><div class="ic">🏠</div><div><small>Shelters</small><b>${S.shelters.length}</b><small>${S.shelters.filter(s=>s.open&&s.demand>0).length} need supplies</small></div></div></div>`};
const batchTbl=(withAct)=>T(['Batch','Items','Donor','Rider','Shelter','Safe left','Status','ETA'],S.batches.map(b=>[`#${b.id}`,`${b.qty} ${b.type}`,esc(b.donor),esc(b.rider||'-'),esc(b.shelter),tl(b),P(b.status),b.eta+'m']));
// ---------- views ----------
const NAV={admin:[['dash','Overview Dashboard'],['donorDesk','Donor Desk'],['riderDesk','Rider Desk'],['shelterDesk','Shelter Desk'],['orders','All Orders & Deliveries'],['guide','Delivery Guide'],['donations','All Donations'],['riders','Rider Management'],['shelters','Shelter Management'],['map','Live Map'],['reports','Reports & Audit'],['approvals','Account Approvals'],['sim','Failure Simulator']],
 donor:[['dash','Dashboard']],rider:[['dash','Dashboard']],shelter:[['dash','Dashboard']]};
const SIMS=[['demo180','1 · Donor adds 180 meals (75 min)'],['autoaccept','2 · Riders accept their batches'],['unconfirmed','3 · Rider fails to confirm reservation'],['unresponsive','4 · Rider unresponsive'],['eta80','5 · ETA 60 → 80 min'],['shelterzero','6 · Shelter demand → 0'],['shelterclose','7 · Shelter closes in transit'],['breakdown','8 · Rider breakdown'],['partial','9 · Partial delivery (20)'],['norider','10 · No eligible riders'],['ration','11 · Ration kits (compatibility)'],['deadline','12 · Deadline missed'],['reset','↺ Reset demo data']];
const V={
 dash(){const r=S.me.role;
  if(r==='rider'){const me=S.riders[0]||{};return `<div class="card"><div class="row"><h3>🛵 ${esc(S.me.name)} <small>capacity ${me.cap} · ${me.online?'Online':'Offline'}</small></h3><div>${B(`act('/rider','POST',{online:${!me.online}})`,me.online?'Go offline':'Go online',me.online?'':'gr')}</div></div><small>⚠ Do not use this screen while driving. Location is only shared from your device's GPS if you allow it.</small></div>`+
   (S.batches.filter(b=>ACT.includes(b.status)).map(b=>`<div class="card"><b>Batch #${b.id}: ${b.qty} ${b.type} → ${esc(b.shelter)}</b> ${P(b.status)}<br><small>Pickup: ${esc(b.address)} · ETA ${b.eta}m</small><br>Safe time left <b>${left(b)}m</b> ${tl(b)}
   <div class="form" style="margin-top:8px">${['Reserved','Handover'].includes(b.status)?`<div>${B(`act('/batches/${b.id}/accept','POST')`,'Accept','gr')} ${B(`act('/batches/${b.id}/reject','POST')`,'Reject')}</div>`:''}
   ${b.status==='Accepted'?`<label>Pickup OTP (from donor)<input id="o${b.id}"></label>${B(`act('/batches/${b.id}/pickup','POST',{otp:$('o${b.id}').value})`,'Verify pickup','fill')}`:''}
   ${b.status==='PickedUp'?`<label>Delivery OTP (from shelter)<input id="o${b.id}"></label><label>Qty delivered<input id="q${b.id}" type="number" value="${b.qty}"></label>${B(`act('/batches/${b.id}/deliver','POST',{otp:$('o${b.id}').value,qty:$('q${b.id}').value})`,'Confirm delivery','gr')}`:''}</div>
   <div class="tabs" style="margin-top:8px">${B(`act('/batches/${b.id}/report','POST',{kind:'traffic'})`,'Report traffic')}${B(`act('/batches/${b.id}/report','POST',{kind:'breakdown'})`,'Breakdown')}${B(`act('/batches/${b.id}/report','POST',{kind:'emergency'})`,'Emergency')}<a class="b" target="_blank" rel="noopener" href="https://www.google.com/maps/dir/?api=1&destination=${S.shelters.find(s=>s.name===b.shelter)?.lat},${S.shelters.find(s=>s.name===b.shelter)?.lng}" style="text-decoration:none">Navigate</a></div></div>`).join('')||'<div class="card mut">No active assignment.</div>')+mapCard()+`<div class="card"><h3>Activity</h3>${feed(15)}</div>`}
  if(r==='shelter')return `<div class="card"><h3>Incoming deliveries</h3>${T(['Batch','Items','Donor','Rider','ETA','Delivery OTP (give to rider)','Status',''],S.batches.filter(b=>b.status!=='Cancelled').map(b=>[`#${b.id}`,`${b.qty} ${b.type}`,esc(b.donor),esc(b.rider||'-'),b.eta+'m',ACT.includes(b.status)?`<b>${b.otp_drop}</b>`:'–',P(b.status),ACT.includes(b.status)?B(`act('/batches/${b.id}/srej','POST',{reason:prompt('Reason for rejecting')||''})`,'Reject'):'']))}</div>${mapCard()}`;
  if(r==='donor')return stats()+`<div class="card"><h3>My donations</h3>${T(['ID','Donor','Items','Quantity','Deadline','Status',''],donRows(S.donations,1))}</div><div class="card"><h3>Pickup tracking &amp; OTP</h3>${T(['Batch','Items','Rider','ETA','Pickup OTP (show rider)','Safe left','Status'],S.batches.map(b=>[`#${b.id}`,`${b.qty} ${b.type}`,esc(b.rider||'-'),b.eta+'m',ACT.includes(b.status)?`<b>${b.otp_pick}</b>`:'–',tl(b),P(b.status)]))}</div>${mapCard()}<div class="card"><h3>Notifications</h3>${feed(15)}</div>`;
  return stats()+`<div class="g2"><div class="card"><div class="row"><h3>Recent Donations</h3>${B("go('donations')",'View All →')}</div>${T(['ID','Donor','Items','Qty','Deadline','Status',''],donRows(S.donations.slice(0,6)))}</div><div class="card"><h3>⚡ Live Activity</h3>${feed(10)}</div></div>${mapCard()}<div class="g2"><div class="card"><h3>🚚 Batches</h3>${batchTbl()}</div>${urgent()}</div>`},
 new(){return `<div class="card"><h3>New donation</h3><form id="nd" class="form"><label>Category<select id="n-t" onchange="$('n-w').value={'Cooked meals':75,'Ration kits':360,'Medical supplies':720,'Infant formula':480}[this.value]"><option>Cooked meals</option><option>Ration kits</option><option>Medical supplies</option><option>Infant formula</option></select></label><label>Quantity<input id="n-q" type="number" value="180" min="1"></label><label>Safety window (min, demo default)<input id="n-w" type="number" value="75" min="5"></label><label>Pickup address<input id="n-a" value="Koregaon Park, Pune"></label><label>Latitude<input id="n-la" value="18.5362"></label><label>Longitude<input id="n-lo" value="73.8938"></label><label>Storage / packaging<input id="n-s" placeholder="Insulated, sealed"></label><label><span><input type="checkbox" id="n-d" checked style="width:auto"> Dispatch now</span></label><button class="b fill">Submit</button></form><small>Real safety windows depend on the food and handling. 75 min is a demo value.</small></div>`},
 donorDesk(){return `<div class="card"><div class="section-head"><div><span class="eyebrow">DONOR OPERATIONS</span><h3>＋ Create a donation</h3><p class="mut">Register surplus food or essential aid and let dispatch match it to suitable riders and shelters.</p></div><span class="p Available">Ready to dispatch</span></div><form id="nd" class="form"><label>Food / aid category<select id="n-t" onchange="$('n-w').value={'Cooked meals':75,'Ration kits':360,'Medical supplies':720,'Infant formula':480}[this.value]"><option>Cooked meals</option><option>Ration kits</option><option>Medical supplies</option><option>Infant formula</option></select></label><label>Quantity<input id="n-q" type="number" value="180" min="1" required></label><label>Safety window (minutes)<input id="n-w" type="number" value="75" min="5" required></label><label>Pickup address<input id="n-a" value="Koregaon Park, Pune" required></label><label>Latitude<input id="n-la" value="18.5362" required></label><label>Longitude<input id="n-lo" value="73.8938" required></label><label>Packaging / handling<input id="n-s" placeholder="Sealed, insulated, fragile"></label><label class="check-label"><input type="checkbox" id="n-d" checked> Auto-dispatch when created</label><div class="form-actions"><button class="b fill">Create donation</button></div></form><small>Admin-created donations are recorded under the demo donor account. Confirm actual safe-use deadlines before dispatch.</small></div>${stats()}<div class="card"><div class="section-head"><div><span class="eyebrow">DONOR RECORDS</span><h3>Donor overview</h3><p class="mut">Summary of registered donors, donation counts and remaining units.</p></div></div>${T(['Donor','Donation count','Remaining units'],[...new Set(S.donations.map(d=>d.donor))].map(n=>[esc(n),S.donations.filter(d=>d.donor===n).length,S.donations.filter(d=>d.donor===n).reduce((a,d)=>a+d.rem,0)]))}</div><div class="card"><div class="section-head"><div><span class="eyebrow">INVENTORY</span><h3>Donations & pickup status</h3></div><span class="p">${S.donations.length} records</span></div>${T(['ID','Donor','Aid','Quantity / remaining','Deadline','Status','Action'],donRows(S.donations))}</div>`},
 riderDesk(){return `<div class="card"><div class="section-head"><div><span class="eyebrow">RIDER OPERATIONS</span><h3>Rider availability & reliability</h3><p class="mut">Dispatch creates a 10-minute reservation. Riders must accept it; if they fail to respond, the reservation expires and the system searches for a replacement.</p></div></div>${T(['Rider','Online','Responsive','Capacity','Location','Last seen','Availability','Admin controls'],S.riders.map(r=>[esc(r.name),r.online?'Online':'Offline',r.responsive?'Responsive':'Unresponsive',r.cap,r.lat?`${r.lat.toFixed(4)}, ${r.lng.toFixed(4)}${r.sim?' <span class="sim">SIMULATED</span>':''}`:'Unknown',r.seen?new Date(r.seen).toLocaleTimeString():'Never',r.online&&r.responsive?'<span class="p Available">Available</span>':'<span class="p SafetyHold">Needs attention</span>',B(`act('/admin/riders/${r.user_id}/status','PATCH',{online:${!r.online},responsive:${!!r.responsive}})`,r.online?'Set offline':'Set online',r.online?'rd':'gr')+' '+B(`act('/admin/riders/${r.user_id}/status','PATCH',{online:${!!r.online},responsive:${!r.responsive}})`,r.responsive?'Mark unresponsive':'Mark responsive',r.responsive?'rd':'gr')]))}</div><div class="card"><div class="section-head"><div><span class="eyebrow">ORDER INBOX</span><h3>Rider assignments waiting for acceptance</h3><p class="mut">These are the rider's incoming order notifications. Accept to confirm the assignment, or reject to trigger reassignment.</p></div><span class="p Available">${S.batches.filter(b=>b.status==='Reserved').length} awaiting response</span></div>${T(['Batch','Rider','Donation','Quantity','Destination','ETA','Reservation expires','Actions'],S.batches.filter(b=>['Reserved','Handover'].includes(b.status)).map(b=>[`#${b.id}`,esc(b.rider||'Unassigned'),`#${b.donation_id} · ${esc(b.type)}`,b.qty,esc(b.shelter),b.eta+' min',b.res_exp?Math.max(0,Math.ceil((b.res_exp-clock())/60000))+' min':'Handover',B(`act('/batches/${b.id}/accept','POST')`,'Accept order','gr')+' '+B(`act('/batches/${b.id}/reject','POST')`,'Reject / reassign','rd')]))}</div><div class="card"><h3>Assignments currently in progress</h3>${T(['Batch','Items','Donor','Rider','Shelter','ETA','Safe left','Status','Actions'],S.batches.filter(b=>['Accepted','PickedUp','Handover'].includes(b.status)).map(b=>[`#${b.id}`,`${b.qty} ${esc(b.type)}`,esc(b.donor),esc(b.rider||'-'),esc(b.shelter),b.eta+' min',tl(b),P(b.status),b.status==='Accepted'?B(`act('/batches/${b.id}/pickup','POST',{otp:'${b.otp_pick}'})`,'Verify pickup'):b.status==='PickedUp'?B(`act('/batches/${b.id}/deliver','POST',{otp:'${b.otp_drop}',qty:${b.qty}})`,'Confirm delivery','gr'):'Waiting for handover']))}</div>`},
 shelterDesk(){return `<div class="card"><h3>Shelter desk — demand and readiness</h3><p class="mut">Update demand or close a site; the dispatch engine will try to recover active deliveries without resetting deadlines.</p>${T(['Shelter','Open','People needed','Reserved','Cooking','Clean water','Admin actions'],S.shelters.map(s=>[esc(s.name),s.open?'Open':'Closed',`<input id="dem${s.id}" type="number" min="0" value="${s.demand}" style="width:80px">`,s.reserved,s.cook?'Yes':'No',s.water?'Yes':'No',B(`act('/shelters/${s.id}','PATCH',{demand:Number($('dem${s.id}').value),open:${!s.open},cook:${!!s.cook},water:${!!s.water}})`,s.open?'Close site':'Reopen site',s.open?'rd':'gr')+B(`act('/shelters/${s.id}','PATCH',{demand:Number($('dem${s.id}').value),open:${!!s.open},cook:${!s.cook},water:${!!s.water}})`,'Toggle cooking')+B(`act('/shelters/${s.id}','PATCH',{demand:Number($('dem${s.id}').value),open:${!!s.open},cook:${!!s.cook},water:${!s.water}})`,'Toggle water')]))}</div><div class="card"><h3>Incoming deliveries by shelter</h3>${T(['Batch','Aid','Donor','Rider','Destination','ETA','Safe time left','Status'],S.batches.map(b=>[`#${b.id}`,`${b.qty} ${b.type}`,esc(b.donor),esc(b.rider||'Unassigned'),esc(b.shelter),b.eta+' min',tl(b),P(b.status)]))}</div>`},
 orders(){return `<div class="card"><div class="row"><h3>All orders & delivery operations</h3>${B("go('sim')",'Open failure simulator')}</div><p class="mut">Use delivery OTPs for demo completion. Admin can simulate rider acceptance and verify pickup/delivery for evaluation.</p>${T(['Batch','Donation','Quantity','Donor','Rider','Shelter','ETA','Safety deadline','Status','Admin actions'],S.batches.map(b=>{const actions=[];if(b.status==='Reserved'||b.status==='Handover')actions.push(B(`act('/batches/${b.id}/accept','POST')`,'Accept / handover','gr'));if(b.status==='Accepted')actions.push(B(`act('/batches/${b.id}/pickup','POST',{otp:'${b.otp_pick}'})`,'Verify pickup'));if(b.status==='PickedUp')actions.push(B(`act('/batches/${b.id}/deliver','POST',{otp:'${b.otp_drop}',qty:${b.qty}})`,'Confirm delivery','gr'));if(b.status==='SafetyHold')actions.push(B(`act('/admin/batches/${b.id}/resolve','POST',{note:prompt('Handling / disposal note')||'Reviewed by admin'})`,'Resolve safety hold','rd'));return [`#${b.id}`,`#${b.donation_id} ${esc(b.type)}`,b.qty,esc(b.donor),esc(b.rider||'Unassigned'),esc(b.shelter),b.eta+' min',`${left(b)} min`,P(b.status),actions.join(' ')||'—']}))}</div><div class="card"><h3>Donation queue (including unallocated units)</h3>${T(['Donation','Donor','Category','Total','Remaining','Deadline','Status','Actions'],S.donations.map(d=>[`#${d.id}`,esc(d.donor),d.type,d.qty,d.rem,`${Math.max(0,Math.round((d.deadline-clock())/60000))} min`,P(d.status),['Available','Pending'].includes(d.status)?B(`act('/donations/${d.id}/dispatch','POST')`,'Retry dispatch','fill')+B(`act('/donations/${d.id}','DELETE')`,'Cancel','rd'):'—']))}</div>`},
 guide(){return `<div class="card"><h3>Delivery guide — coordinator checklist</h3><div class="g2"><div><h3>1. Create and validate</h3><p>Record the donor, aid type, quantity, pickup location, packaging and the real safe-use deadline. The 75-minute cooked-meal window is a demo default, not a universal safety rule.</p><h3>2. Match before dispatch</h3><p>The engine splits large donations by rider capacity and shelter demand. Ration kits require cooking facilities; infant formula requires clean water in the prototype.</p><h3>3. Reservation and pickup</h3><p>Reservations expire after 10 minutes without confirmation. The 15-minute unresponsive-rider rule triggers recovery checks. OTPs verify donor pickup and shelter handoff.</p><h3>4. Traffic or ETA risk</h3><p>If estimated arrival exceeds remaining safe time, the system attempts recovery immediately. It never resets the original deadline to make a late delivery appear safe.</p></div><div><h3>5. Shelter changes mid-route</h3><p>When demand falls to zero or a shelter closes, use Shelter Desk to update it. Active deliveries are rerouted when a compatible alternative can be reached in time.</p><h3>6. Rider failure / handover</h3><p>Use the failure simulator to test an unresponsive rider, breakdown, traffic, missed deadline and replacement rider. A new rider is only assigned if the estimated handover and delivery fit the remaining deadline.</p><h3>7. Safety hold</h3><p>If no safe route exists, the batch goes to Safety Hold. Do not mark it delivered; review handling guidance and record the disposal/review note.</p><h3>8. Final confirmation</h3><p>Verify the delivery OTP, quantity actually received and receiving-site demand. Audit events remain visible under Reports &amp; Audit.</p></div></div><div class="notice" style="padding:12px;background:#fff7e6;border-radius:10px"><b>Prototype limitation:</b> ETA uses distance, road factor and assumed speed; there is no live traffic API. Confirm real food safety and local handling rules before real-world use.</div></div>`},
 donations(){return `<div class="card"><h3>Donations</h3>${T(['ID','Donor','Items','Quantity','Deadline','Status',''],donRows(S.donations))}</div>`},
 riders(){return `<div class="card"><h3>Riders</h3>${T(['Rider','Online','Responsive','Capacity','Position','Last seen'],S.riders.map(r=>[esc(r.name),r.online?'Yes':'No',r.responsive?'Yes':'No',r.cap,r.lat?`${r.lat.toFixed(3)}, ${r.lng.toFixed(3)}${r.sim?' <span class="sim">SIMULATED</span>':''}`:'unknown',new Date(r.seen).toLocaleTimeString()]))}</div>`},
 shelters(){return `<div class="card"><h3>Shelters</h3>${T(['Shelter','Open','Demand','Reserved','Cooking','Water'],S.shelters.map(s=>[esc(s.name),s.open?'Yes':'Closed',s.demand,s.reserved,s.cook?'✔':'✘',s.water?'✔':'✘']))}</div>`},
 demand(){const s=S.shelters.find(x=>x.user_id===S.me.id)||S.shelters[0];return `<div class="card"><h3>${esc(s.name)}</h3><div class="form"><label>Demand<input id="d-n" type="number" value="${s.demand}"></label><label><span><input type="checkbox" id="d-o" ${s.open?'checked':''} style="width:auto"> Open</span></label><label><span><input type="checkbox" id="d-c" ${s.cook?'checked':''} style="width:auto"> Cooking facility</span></label><label><span><input type="checkbox" id="d-w" ${s.water?'checked':''} style="width:auto"> Clean water</span></label>${B(`act('/shelters/${s.id}','PATCH',{demand:$('d-n').value,open:$('d-o').checked,cook:$('d-c').checked,water:$('d-w').checked})`,'Save','fill')}</div><small>Demand: ${s.demand} · reserved ${s.reserved}. Reducing demand or closing reroutes in-transit batches.</small></div>`},
 history(){return `<div class="card"><h3>History</h3>${batchTbl()}</div>`},
 map(){return mapCard(1)+urgent()},
 reports(){return `<div class="card"><h3>Batches</h3>${batchTbl()}</div><div class="card"><h3>Audit log</h3>${feed(200)}</div>`},
 approvals(){return `<div class="card"><h3>Pending approvals</h3>${T(['Name','Email','Role',''],S.pending.map(u=>[esc(u.name),esc(u.email),u.role,B(`act('/admin/approve/${u.id}','POST')`,'Approve','gr')]))}</div>`},
 sim(){return `<div class="card"><h3>🧪 Failure simulator <span class="sim">SIMULATED SCENARIOS</span></h3><div class="sims">${SIMS.map(s=>B(`act('/admin/sim/${s[0]}','POST')`,s[1])).join('')}</div><small>Runs the real engine on demo records; events are labelled [SIMULATED]. Run 1, then 2, then others.</small></div><div class="g2"><div class="card"><h3>Resulting actions</h3>${feed(40)}</div>${urgent()}</div><div class="card"><h3>Batches</h3>${batchTbl()}</div>${mapCard()}`}};
const go=v=>{view=v;render()};
function render(){if(!S)return;const r=S.me.role;if(!NAV[r].some(n=>n[0]===view))view='dash';
 $('side').innerHTML=`<div class="logo">🚴 Route2Root<small>Food · Aid · Hope</small></div>`+NAV[r].map(n=>`<button class="nav ${view===n[0]?'on':''}" onclick="go('${n[0]}')">${n[1]}</button>`).join('')+`<button class="nav" onclick="logout()">Logout</button><div class="quote">“Good food, essential aid and timely delivery can change lives.”</div>`;
 $('top').innerHTML=`<small>One admin console · donors, riders, shelters and every delivery in one place.</small><div class="row"><span>⚠ ${act_().filter(b=>left(b)<20).length} urgent</span><b>${esc(S.me.name)}</b><span class="p">ADMIN</span><button class="b" onclick="logout()">Logout</button></div>`;
 if(mapEl&&mapEl.parentNode)mapEl.remove();const pageMeta={dash:['Operations overview','A live snapshot of donations, deliveries, capacity and urgent exceptions.'],donorDesk:['Donor desk','Create donations and manage available surplus.'],riderDesk:['Rider desk','Monitor rider availability, capacity and assignments.'],shelterDesk:['Shelter desk','Manage receiving capacity, readiness and incoming aid.'],orders:['Orders & deliveries','Follow every batch from reservation through safe handoff.'],guide:['Delivery guide','Operational rules for safe dispatch and recovery.'],donations:['All donations','Review inventory, deadlines and dispatch status.'],riders:['Rider management','Availability, capacity and reliability.'],shelters:['Shelter management','Demand, site readiness and compatibility.'],map:['Live operations map','Geographic view of donors, riders, shelters and active routes.'],reports:['Reports & audit','Review events and operational outcomes.'],approvals:['Account approvals','Review access requests.'],sim:['Failure simulator','Exercise failure scenarios before the judging demo.']};const meta=pageMeta[view]||pageMeta.dash;$('content').innerHTML=`<div class="page-heading"><div><div class="eyebrow">ROUTE2ROOT / OPERATIONS</div><h1>${meta[0]}</h1><p>${meta[1]}</p></div><div class="updated"><span class="live-dot"></span> Demo data · auto-refresh</div></div>`+V[view]();const f=$('nd');if(f)f.onsubmit=async e=>{e.preventDefault();const v=id=>$(id).value;try{await api('/donations','POST',{type:v('n-t'),qty:v('n-q'),win:v('n-w'),address:v('n-a'),lat:v('n-la'),lng:v('n-lo'),storage:v('n-s'),dispatch:$('n-d').checked});view=(S&&S.me.role==='admin'&&view==='donorDesk')?'donorDesk':'dash';await load();toast('Donation created')}catch(x){toast(x.message)}};
 drawMap()}
function drawMap(){const slot=$('slot');if(!slot)return;if(!map){mapEl=document.createElement('div');mapEl.id='map';slot.appendChild(mapEl);map=L.map(mapEl).setView([18.52,73.86],12);L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png',{maxZoom:19,attribution:'© OpenStreetMap contributors'}).addTo(map);layer=L.layerGroup().addTo(map)}
 else{slot.appendChild(mapEl);map.invalidateSize()}
 layer.clearLayers();const pin=(lat,lng,e,t)=>L.marker([lat,lng],{icon:L.divIcon({html:`<div class="pin">${e}</div>`,className:'',iconSize:[24,24]})}).bindPopup(t).addTo(layer);
 S.donations.filter(d=>['Available','Pending','Dispatched'].includes(d.status)).forEach(d=>pin(d.lat,d.lng,'🔴',`${esc(d.donor)}: ${d.rem} ${d.type} left`));
 S.shelters.forEach(s=>pin(s.lat,s.lng,s.open?'🏠':'⛔',`${esc(s.name)}<br>demand ${s.demand}, reserved ${s.reserved}`));
 S.riders.forEach(r=>r.lat&&pin(r.lat,r.lng,'🛵',`${esc(r.name)} ${r.online?'online':'offline'}${r.sim?' (simulated position)':''}`));
 S.batches.filter(b=>ACT.includes(b.status)).forEach(b=>{const s=S.shelters.find(x=>x.id===b.shelter_id);if(s)L.polyline([[b.lat,b.lng],[s.lat,s.lng]],{color:left(b)<20?'#dc2626':'#16a34a',weight:3,dashArray:'6'}).addTo(layer)})}
boot();
</script></body></html>
